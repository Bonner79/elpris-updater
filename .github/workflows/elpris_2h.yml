name: Elpris 2H Updater

on:
  schedule:
    - cron: '10 15 * * *'  # 15:10 UTC = 17:10 svensk sommartid (16:10 vintertid), dvs efter att morgondagens priser publicerats
    - cron: '10 19 * * *'  # retry 19:10 UTC om eftermiddagskorningen missade (t.ex. priser inte publicerade)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Run elpris_2h.py
        env:
          GIST_ID: ${{ secrets.GIST_ID_2H }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN_2H }}
        run: python elpris_2h.py
