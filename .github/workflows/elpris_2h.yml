name: Elpris 2H Updater

on:
  schedule:
    # Alla tider i UTC. GitHub-cron följer inte sommartid.
    # Dagen-före-priserna publiceras 12:55 CET/CEST, men kan bli senare.
    # Fyra försök så att en försenad eller överhoppad körning inte sänker dygnet.
    - cron: '36 12 * * *'  # 14:36 sommartid / 13:36 vintertid – normalfallet
    - cron: '36 15 * * *'  # 17:36 / 16:36 – täcker försenad publicering
    - cron: '36 19 * * *'  # 21:36 / 20:36
    - cron: '36 21 * * *'  # 23:36 / 22:36 – sista chansen före midnatt
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install requests
        run: pip install requests

      - name: Run elpris_2h.py
        env:
          GIST_ID: ${{ secrets.GIST_ID_2H }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN_2H }}
        run: python elpris_2h.py
