name: Elpris 1H Updater

on:
  schedule:
    # Alla tider i UTC. GitHub-cron följer inte sommartid.
    # Dagen-före-priserna publiceras 12:55 CET/CEST, men kan bli senare.
    # Fyra försök så att en försenad eller överhoppad körning inte sänker dygnet.
    - cron: '35 12 * * *'  # 14:35 sommartid / 13:35 vintertid – normalfallet
    - cron: '35 15 * * *'  # 17:35 / 16:35 – täcker försenad publicering
    - cron: '35 19 * * *'  # 21:35 / 20:35
    - cron: '35 21 * * *'  # 23:35 / 22:35 – sista chansen före midnatt
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install requests
        run: pip install requests

      - name: Run elpris_1h.py
        env:
          GIST_ID: ${{ secrets.GIST_ID_1H }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN_1H }}
        run: python elpris_1h.py
