name: Elpris 1H Updater

on:
  schedule:
    - cron: '5 15 * * *'  # 15:05 UTC = 17:05 svensk sommartid (16:05 vintertid), dvs efter att morgondagens priser publicerats
    - cron: '5 19 * * *'  # retry 19:05 UTC om eftermiddagskorningen missade (t.ex. priser inte publicerade)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Run elpris_1h.py
        env:
          GIST_ID: ${{ secrets.GIST_ID_1H }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN_1H }}
        run: python elpris_1h.py
