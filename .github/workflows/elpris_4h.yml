name: Elpris 4H Updater

on:
  schedule:
    # Alla tider i UTC. Dagen-före-priserna publiceras 12:55 CET/CEST.
    # Fyra försök, så att en försenad eller överhoppad körning inte sänker dygnet.
    - cron: '38 12 * * *'  # 14:38 sommartid / 13:38 vintertid – normalfallet
    - cron: '38 15 * * *'  # 17:38 / 16:38 – täcker försenad publicering
    - cron: '38 19 * * *'  # 21:38 / 20:38
    - cron: '38 21 * * *'  # 23:38 / 22:38 – sista chansen före midnatt, larmar
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests

      - name: Run elpris updater
        env:
          GIST_ID: 38a1294a14afc7b05553c2658576a721
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: python update_gist.py
