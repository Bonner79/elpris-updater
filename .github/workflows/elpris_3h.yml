name: Elpris 3H Updater

on:
  schedule:
    - cron: '15 15 * * *'  # 15:15 UTC = 17:15 svensk sommartid (16:15 vintertid), dvs efter att morgondagens priser publicerats
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Run elpris_3h.py
        env:
          GIST_ID: ${{ secrets.GIST_ID_3H }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN_3H }}
        run: python elpris_3h.py
